name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deploy dependencies + PyYAML (for render.yaml validation)
        run: pip install -r requirements-deploy.txt pyyaml
      - name: Python syntax check -- every file under api/
        run: |
          python -c "
          import ast, pathlib, sys
          failed = False
          for f in pathlib.Path('api').rglob('*.py'):
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  print(f'SYNTAX ERROR in {f}: {e}')
                  failed = True
          sys.exit(1 if failed else 0)
          "
      - name: Portable clean-clone contract
        run: python scripts/verify_clean_clone.py
      - name: Deployment readiness check
        run: python scripts/check_deployment_readiness.py

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build (catches things typecheck alone won't --
          e.g. the useSearchParams-needs-Suspense class of error)
        run: npm run build
